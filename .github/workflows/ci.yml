name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Offline tests
        run: pytest
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Build .mcpb (validates manifest)
        shell: bash
        run: python scripts/build_mcpb.py dist
      - name: Server starts and lists tools
        shell: bash
        run: |
          python - <<'EOF'
          import asyncio, os, sys
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client
          async def main():
              p = StdioServerParameters(command=sys.executable, args=["-m", "isir_mcp.server"], env={**os.environ})
              async with stdio_client(p) as (r, w):
                  async with ClientSession(r, w) as s:
                      await s.initialize()
                      names = sorted(t.name for t in (await s.list_tools()).tools)
                      print(names)
                      assert "isir_text_dokumentu" in names and len(names) == 9
          asyncio.run(main())
          EOF
